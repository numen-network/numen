[workspace.package]
license = "MIT"
authors = ["numen-network"]
homepage = "https://github.com/numen-network/numen"
repository = "https://github.com/numen-network/numen.git"
edition = "2024"

[workspace]
members = [
    "consensus/obj-asteroid",
    "consensus/poscan",
    "consensus/poscan-pow",
    "consensus/sc-consensus-pow",
    "node",
    "pallets/difficulty",
    "pallets/evm-claims",
    "pallets/prime",
    "pallets/reward",
    "pallets/validator",
    "runtime",
    "vendor/fc-rpc-core",
]
exclude = ["vendor/pallet-revive"]
resolver = "2"

[workspace.dependencies]
numen-runtime = { path = "./runtime", default-features = false }
poscan = { path = "./consensus/poscan", default-features = false }
poscan-pow = { path = "./consensus/poscan-pow", default-features = false }
obj-asteroid = { path = "./consensus/obj-asteroid", default-features = false }
pallet-difficulty = { path = "./pallets/difficulty", default-features = false }
pallet-evm-claims = { path = "./pallets/evm-claims", default-features = false }
pallet-prime = { path = "./pallets/prime", default-features = false }
pallet-reward = { path = "./pallets/reward", default-features = false }
pallet-validator = { path = "./pallets/validator", default-features = false }
clap = { version = "4.6.1" }
futures = { version = "0.3.32" }
futures-timer = { version = "3.0.3" }
jsonrpsee = { version = "0.24.10" }
tokio = { version = "1.45", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
primitive-types = { version = "0.13.1", default-features = false, features = ["codec"] }
async-trait = { version = "0.1.89" }
log = { version = "0.4.29" }
parking_lot = { version = "0.12.5" }
thiserror = { version = "2.0.18" }
scale-info = { version = "2.11.6", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.149", default-features = false }
codec = { version = "3.7.4", default-features = false, package = "parity-scale-codec" }
enumflags2 = { version = "0.7.11", default-features = false }
libm = { version = "=0.2.16" }
rand_pcg = { version = "=0.10.2", default-features = false }
rand_core = { version = "=0.10.1", default-features = false }
spectral3d = { git = "https://github.com/numen-network/spectral3d.git", rev = "af77fd9" }
hex-literal = "1.1.0"
ethereum = { version = "0.18.2", features = ["with-scale", "with-serde"] }
ethereum-types = { version = "0.15.1" }
evm-core = { version = "0.43.0", features = ["with-codec"] }
fc-rpc-core = { path = "./vendor/fc-rpc-core" }
rlp = { version = "0.6.1" }
rustc-hex = { version = "2.1.0" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
frame-benchmarking-cli = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
frame-metadata-hash-extension = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
pallet-transaction-payment = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
pallet-transaction-payment-rpc = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
sc-basic-authorship = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
sc-chain-spec = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
