[profile.release]
opt-level = 3
panic = "unwind"

[profile.production]
codegen-units = 1
inherits = "release"
lto = true

[patch."https://github.com/paritytech/polkadot-sdk"]
pallet-revive = { path = "vendor/pallet-revive" }
