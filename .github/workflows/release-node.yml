name: Release node

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches node version
        id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' node/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag node/Cargo.toml version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not match node/Cargo.toml version '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/ubuntu-dependencies
      - name: Run tests
        run: SKIP_WASM_BUILD=1 cargo test --workspace --locked
        timeout-minutes: 30

  zombienet:
    needs: check-version
    uses: ./.github/workflows/zombienet.yml

  build:
    needs: [check-version, test, zombienet]
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: numen-linux-x86_64
            archive: tar.gz
            ext: ''
          - os: macos-latest
            asset: numen-macos-arm64
            archive: tar.gz
            ext: ''
          - os: windows-latest
            asset: numen-windows-x86_64
            archive: zip
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure git line endings (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.autocrlf false
          git config --global core.protectNTFS false

      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space
        if: matrix.os == 'ubuntu-latest'

      - name: Rust compilation prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/ubuntu-dependencies

      - name: Rust compilation prerequisites (macOS)
        if: matrix.os == 'macos-latest'
        uses: ./.github/actions/macos-dependencies

      - name: Rust compilation prerequisites (Windows)
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/windows-dependencies

      - name: Build node
        run: cargo build --profile production --locked -p numen --features metadata-hash
        timeout-minutes: 90

      - name: Build eth-rpc
        run: bash .maintain/build-eth-rpc.sh target/eth-rpc --profile production
        timeout-minutes: 90

      - name: Bundle release archive
        run: |
          mkdir -p ${{ matrix.asset }}
          cp target/production/numen${{ matrix.ext }} target/eth-rpc/bin/eth-rpc${{ matrix.ext }} ${{ matrix.asset }}/
          cp mainnet-raw.json ${{ matrix.asset }}/
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path '${{ matrix.asset }}' -DestinationPath '${{ matrix.asset }}.zip' -Force"
          else
            tar -czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}.${{ matrix.archive }}
          path: ${{ matrix.asset }}.${{ matrix.archive }}

  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'numen-*'
          merge-multiple: true

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          name: Numen v${{ needs.check-version.outputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: artifacts/*

