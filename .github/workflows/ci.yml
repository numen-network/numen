name: CI

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.json'
              - '!LICENSE'
              - '!.maintain/**'
              - '!scripts/**'
              - '!zombienet/**'

  clippy:
    needs: changes
    # Skipped jobs count as passing required checks. Run these even when the changes job fails.
    if: &code ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/ubuntu-dependencies
      - name: Run clippy
        run: SKIP_WASM_BUILD=1 cargo clippy --all-targets --locked --workspace --quiet -- -D warnings
        timeout-minutes: 30
      - name: Run clippy (runtime-benchmarks)
        run: SKIP_WASM_BUILD=1 cargo clippy --all-targets --locked --workspace --features runtime-benchmarks --quiet -- -D warnings
        timeout-minutes: 30

  test:
    needs: changes
    if: *code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/ubuntu-dependencies
      - name: Run tests
        run: SKIP_WASM_BUILD=1 cargo test --workspace --locked
        timeout-minutes: 30
      - name: Run tests (runtime-benchmarks)
        run: SKIP_WASM_BUILD=1 cargo test --workspace --locked --features runtime-benchmarks
        timeout-minutes: 30

  weights:
    needs: changes
    if: *code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject hand written weights
        run: |
          if grep -rn 'pallet::weight(Weight::' pallets/ runtime/src/; then
            echo "::error::dispatchables must bill through T::WeightInfo. Regenerate with .maintain/run-benchmarks.sh"
            exit 1
          fi

  runtime-wasm:
    needs: changes
    if: *code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/ubuntu-dependencies
      - name: Build runtime wasm (no_std)
        run: cargo check -p numen-runtime --locked --features metadata-hash
        timeout-minutes: 45

  # Skipped matrix jobs report unexpanded names that no required check matches.
  determinism-x86_64:
    name: determinism (x86_64)
    needs: changes
    if: *code
    runs-on: ubuntu-latest
    steps: &determinism
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - name: Native golden
        run: |
          cargo test -p obj-asteroid --test determinism --locked
          cargo test -p obj-asteroid --test spectral --locked golden
          cargo test -p poscan --test golden --locked
        timeout-minutes: 15
      - name: Add wasm target
        run: rustup target add wasm32-wasip1
      - name: Wasm golden (wasmtime)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime run --"
        run: |
          cargo test -p obj-asteroid --test determinism --target wasm32-wasip1 --locked
          cargo test -p obj-asteroid --test spectral --target wasm32-wasip1 --locked golden
          cargo test -p poscan --test golden --target wasm32-wasip1 --locked
        timeout-minutes: 15

  determinism-aarch64:
    name: determinism (aarch64)
    needs: changes
    if: *code
    runs-on: ubuntu-24.04-arm
    steps: *determinism
