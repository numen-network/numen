[package]
name = "pallet-revive"
version = "0.20.2"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2024"
license = "Apache-2.0"
homepage = "https://paritytech.github.io/polkadot-sdk/"
repository = "https://github.com/paritytech/polkadot-sdk.git"
description = "FRAME pallet for PolkaVM contracts."
readme = "README.md"
include = ["CHANGELOG.md", "README.md", "build.rs", "src/**/*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints.rust]
suspicious_double_ref_op = { level = "allow", priority = 2 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(build_opt_level, values(\"3\"))", "cfg(build_profile, values(\"debug\", \"release\"))", "cfg(enable_alloc_error_handler)", "cfg(fuzzing)", "cfg(ignore_flaky_test)", "cfg(revive_debug)", "cfg(substrate_runtime)"] }

[lints.clippy]
all = { level = "allow", priority = 0 }
bind_instead_of_map = { level = "allow", priority = 2 }
borrowed-box = { level = "allow", priority = 2 }
complexity = { level = "warn", priority = 1 }
correctness = { level = "warn", priority = 1 }
default_constructed_unit_structs = { level = "allow", priority = 2 }
derivable_impls = { level = "allow", priority = 2 }
eq_op = { level = "allow", priority = 2 }
erasing_op = { level = "allow", priority = 2 }
extra-unused-type-parameters = { level = "allow", priority = 2 }
identity-op = { level = "allow", priority = 2 }
if-same-then-else = { level = "allow", priority = 2 }
needless-lifetimes = { level = "allow", priority = 2 }
needless_option_as_deref = { level = "allow", priority = 2 }
nonminimal-bool = { level = "allow", priority = 2 }
option-map-unit-fn = { level = "allow", priority = 2 }
stable_sort_primitive = { level = "allow", priority = 2 }
too-many-arguments = { level = "allow", priority = 2 }
type_complexity = { level = "allow", priority = 2 }
unit_arg = { level = "allow", priority = 2 }
unnecessary_cast = { level = "allow", priority = 2 }
useless_conversion = { level = "allow", priority = 2 }
while_immutable_condition = { level = "allow", priority = 2 }
zero-prefixed-literal = { level = "allow", priority = 2 }

[dependencies]
alloy-consensus = { version = "1.0.41", default-features = false }
alloy-core = { version = "1.2.1", default-features = false, features = ["rlp", "sol-types"] }
alloy-trie = { version = "0.9.1", default-features = false }
codec = { version = "3.7.5", default-features = false, package = "parity-scale-codec", features = ["derive", "max-encoded-len"] }
derive_more = { version = "0.99.17", default-features = false, features = ["from", "try_into"] }
environmental = { version = "1.1.4", default-features = false }
ethereum-standards = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609" }
ethereum-types = { version = "0.15.1", default-features = false, features = ["codec", "rlp", "serialize"] }
hex-literal = { version = "0.4.1", default-features = false }
impl-trait-for-tuples = { version = "0.2.2" }
k256 = { version = "0.13.4", default-features = false, features = ["alloc", "ecdsa"], optional = true }
log = { version = "0.4.22", default-features = false }
num-bigint = { version = "0.4.6", default-features = false }
num-integer = { version = "0.1.46", default-features = false }
num-traits = { version = "0.2.17", default-features = false }
paste = { version = "1.0.15", default-features = false }
polkavm = { version = "0.35.0", default-features = false }
polkavm-common = { version = "0.35.0", default-features = false, features = ["alloc"] }
rand = { version = "0.8.5", default-features = false, optional = true }
rand_pcg = { version = "0.3.1", optional = true }
revm = { version = "27.0.2", default-features = false }
rlp = { version = "0.6.1", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde = { version = "1.0.214", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.132", default-features = false, features = ["alloc"] }
bn = { package = "substrate-bn", version = "0.6", default-features = false }
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false, optional = true }
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
pallet-revive-fixtures = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false, optional = true }
pallet-revive-proc-macro = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
pallet-revive-types = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
pallet-revive-uapi = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false, features = ["precompiles-sol-interfaces", "scale"] }
pallet-transaction-payment = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
ripemd = { version = "0.1.3", default-features = false }
sp-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
sp-arithmetic = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
sp-consensus-aura = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false, optional = true }
sp-consensus-babe = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false, optional = true }
sp-consensus-slots = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false, optional = true }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
sp-crypto-hashing = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
subxt-signer = { version = "0.50", optional = true, features = ["unstable-eth"] }

[dev-dependencies]
alloy-consensus = { version = "1.0.41", default-features = true }
array-bytes = { version = "6.2.2", default-features = true }
assert_matches = { version = "1.5.0" }
itertools = { version = "0.11" }
pretty_assertions = { version = "1.3.0" }
secp256k1 = { version = "0.28.0", default-features = false, features = ["recovery"] }
serde_json = { version = "1.0.132", default-features = false }
strum = { version = "0.26.3", default-features = false, features = ["derive"] }
test-case = { version = "=3.3.1" }
pallet-assets = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = true }
pallet-assets-freezer = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = true }
pallet-assets-holder = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = true }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = true }
pallet-proxy = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = true }
pallet-revive-fixtures = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = true }
pallet-timestamp = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = true }
pallet-utility = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = true }
proptest = { version = "1" }
sp-keystore = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = true }
sp-state-machine = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = false }
sp-tracing = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2609", default-features = true }

[features]
default = ["std"]
std = ["alloy-consensus/serde", "alloy-consensus/std", "alloy-core/std", "alloy-trie/std", "codec/std", "environmental/std", "ethereum-types/std", "frame-benchmarking?/std", "frame-support/std", "frame-system/std", "k256?/std", "log/std", "num-bigint/std", "num-integer/std", "num-traits/std", "pallet-proxy/std", "pallet-revive-fixtures?/std", "pallet-revive-types/std", "pallet-timestamp/std", "pallet-transaction-payment/std", "pallet-utility/std", "polkavm-common/std", "polkavm/std", "rand?/std", "revm/std", "ripemd/std", "rlp/std", "scale-info/std", "secp256k1/std", "serde/std", "serde_json/std", "sp-api/std", "sp-arithmetic/std", "sp-consensus-aura/std", "sp-consensus-babe/std", "sp-consensus-slots/std", "sp-core/std", "sp-crypto-hashing/std", "sp-io/std", "sp-keystore/std", "sp-runtime/std", "sp-state-machine/std", "sp-version/std", "strum/std", "subxt-signer"]
runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks", "frame-support/runtime-benchmarks", "frame-system/runtime-benchmarks", "k256", "pallet-assets-freezer/runtime-benchmarks", "pallet-assets-holder/runtime-benchmarks", "pallet-assets/runtime-benchmarks", "pallet-balances/runtime-benchmarks", "pallet-proxy/runtime-benchmarks", "pallet-revive-fixtures", "pallet-timestamp/runtime-benchmarks", "pallet-transaction-payment/runtime-benchmarks", "pallet-utility/runtime-benchmarks", "rand", "rand_pcg", "sp-consensus-aura", "sp-consensus-babe", "sp-consensus-slots", "sp-runtime/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime", "frame-system/try-runtime", "pallet-assets-freezer/try-runtime", "pallet-assets-holder/try-runtime", "pallet-assets/try-runtime", "pallet-balances/try-runtime", "pallet-proxy/try-runtime", "pallet-timestamp/try-runtime", "pallet-transaction-payment/try-runtime", "pallet-utility/try-runtime", "sp-runtime/try-runtime"]
trybuild = []
