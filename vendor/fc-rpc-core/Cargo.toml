[package]
name = "fc-rpc-core"
version = "1.1.0-dev"
description = "RPC traits of Ethereum, vendored unchanged from Frontier baf505d"
authors = ["Frontier developers <legal@bitarray.dev>"]
edition = "2021"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
repository = "https://github.com/polkadot-evm/frontier/"
publish = false

[dependencies]
ethereum.workspace = true
ethereum-types.workspace = true
jsonrpsee = { features = ["macros", "server"], workspace = true }
rlp.workspace = true
rustc-hex.workspace = true
serde.workspace = true
serde_json.default-features = true
serde_json.workspace = true
sp-core.default-features = true
sp-core.workspace = true
sp-crypto-hashing.default-features = true
sp-crypto-hashing.workspace = true

[features]
txpool = []
